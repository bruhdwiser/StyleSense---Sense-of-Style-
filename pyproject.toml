[project]
name = "stylesense-ai"
version = "1.0.0"
description = "StyleSense AI — Production Engine Architecture"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
]

[tool.pyright]
include = ["backend", "scripts"]
extraPaths = ["backend", "backend/app"]
venvPath = "backend"
venv = ".venv"
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
